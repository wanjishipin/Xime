[package]
name = "xipm"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hmac = "0.13.0"
json5 = "1.3.1"
rolldown = "1.2.9"
rquickjs = { version = "0.13.0", features = ["futures", "macro", "bindgen"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
walkdir = "2.5.0"
zip = "8.6.0"
