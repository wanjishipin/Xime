# Rime schema
# encoding: utf-8
# 拼音 14 键（与 pinyin_simp 共享字典）
# 合并键布局：qw/er/ty/ui/op、as/df/gh/jk/l、zx/cv/bn/m
# 前端点击合并键只发代表字母（组内第一个字母），
# 由 speller/algebra 把词库拼音码派生出"按键序列码"，靠词库消歧：
#   derive/(.*)/\U$1/   先派生大写副本（不污染原始小写码）
#   xlit/大写字母/代表字母/  再把大写副本逐位映射为按键序列
schema:
  schema_id: pinyin_14jian
  name: 拼音14键
  version: "1.0"
  description: |
    拼音 14 键方案，字母两两合并（qw/er/ty/ui/op、as/df/gh/jk/l、zx/cv/bn/m），
    键宽更大误触更少，与九键同为词库消歧。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
    - lua_translator@*uuid

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # 简拼与容错规则（与 pinyin_simp 一致）
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # 合并键"按键序列码"派生：先把每条码复制为大写（不污染原始小写码），
    # 再由 xlit 逐位映射为该键的代表字母（与 xime.yaml qwerty_14 分组一一对应）
    - derive/(.*)/\U$1/
    - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qqeettuuooaaddggjjlzzccbbm/

translator:
  dictionary: pinyin_simp
  prism: pinyin_14jian
  packs:
    - user_simp
  spelling_hints: 8
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/

menu:
  page_size: 5

punctuator:
  import_preset: default
  __include: symbols:/punctuator

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"
    reverse_lookup: "`[a-z]*'?$"
