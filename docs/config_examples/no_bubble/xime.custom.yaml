# 无气泡版（只保留长按气泡）—— 基于内置 xime.yaml 生成，复制为 rime 用户目录下的
# xime.custom.yaml 即生效（应用内可经「Rime 文件浏览器」导入 / 编辑）。
#
# 关掉两类运行时气泡（都是每个键自己的 bubble 开关，默认 true）：
#   · swipe_up / swipe_down 的 bubble: false —— 上滑、下滑不再弹内容气泡；
#   · tap 的 bubble: false —— 按下键帽不再弹放大气泡（此前 tap 的 bubble 字段解析了但没生效，现已支持）。
# 不写这个文件 = 原来的行为。
#
# 不动的部分：
#   · 长按气泡（长按候选只有气泡形态，没有开关）；
#   · 键面静态提示与手势动作（上滑数字、下滑字根提示照常触发生效）；
#   · 下滑字根那类是 display: bubble + action: none 的纯提示，关气泡后不再显示，
#     想挪到键面上就把它改成 display: key（键面最多显示 2 个字）。
#
# 注意：按键配置是「键级覆盖」——写了一个键就要把它的绑定写全，所以行很长；
# 内容全部来自内置 xime.yaml，仅把 bubble 改成 false。内置改了手势后重新生成即可。
# 未覆盖：合并键布局里内建未定义的 mode_change 键、九键数字键（数字键按压气泡本来就是关的）。

keyboard:
  # ── qwerty ──
  qwerty:
    keys:
      q: { tap: { label: "q", value: "q", display: "both", bubble: false }, swipe_up: { label: "1", value: "1", display: "both", bubble: false }, swipe_down: { label: "金 钅𠂊勺㐅 犭𱼀", action: "none", display: "bubble", bubble: false }, long_press: { display: "bubble", values: ["q", "Q"] } }
